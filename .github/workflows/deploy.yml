name: Deploy

# Despliega el backend al droplet con Kamal en cada push a main que toque el backend.
# Solo despliega: los tests corren antes, en el hook pre-push de cada máquina (.githooks/pre-push).
on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - package.json
      - package-lock.json
      - Dockerfile
      - config/deploy.yml
      - .kamal/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Todo sale del vault "DevOps Routines" de 1Password: el único secreto del repositorio es OP_SERVICE_ACCOUNT_TOKEN.
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Check deploy secret
        run: |
          if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "::error::Falta el secreto OP_SERVICE_ACCOUNT_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Install Kamal
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      # La misma versión que Wave (backend/Gemfile.lock). Una más nueva exige reiniciar kamal-proxy, que comparten
      # Vatio y Wave: subirla solo junto con ellos.
      - run: gem install kamal -v 2.7.0 --no-document

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # La IP del droplet no va en este repositorio público (está detrás de Cloudflare): se pide a DigitalOcean.
      - name: Find the droplet
        run: |
          token=$(op read "op://DevOps Routines/DigitalOcean/API_KEY")
          ip=$(curl -fsS -H "Authorization: Bearer $token" https://api.digitalocean.com/v2/droplets/519098336 \
            | jq -r '.droplet.networks.v4[] | select(.type == "public") | .ip_address' | head -1)
          [ -n "$ip" ] || { echo "::error::No se pudo obtener la IP del droplet"; exit 1; }
          echo "::add-mask::$ip"
          echo "DEPLOY_HOST=$ip" >> "$GITHUB_ENV"

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          op read "op://DevOps Routines/Droplet SSH/private key?ssh-format=openssh" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Entradas sin hash: SSHKit (Kamal) no entiende las de ssh-keyscan -H.
          ssh-keyscan -t ed25519,ecdsa,rsa "$DEPLOY_HOST" > ~/.ssh/known_hosts

      - name: Verify SSH connection
        run: ssh -o BatchMode=yes -o IdentitiesOnly=yes "root@$DEPLOY_HOST" echo ok

      - name: Deploy
        run: kamal deploy

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://chambeando.urcalab.com/health && exit 0
            sleep 10
          done
          exit 1
