# frecuencia_avisos
description: Cambia cada cuánto le llegan a la persona los avisos automáticos y, si es una vez al día o a la semana, desde qué hora.
when_to_use: La persona pide que le escribas menos o más seguido, una vez al día, una vez a la semana o a cierta hora ("me llegan muchos mensajes", "mándamelos en la tarde", "solo los lunes").
parameters:
  type: object
  properties:
    frecuencia:
      type: string
      enum: [apenas, diaria, semanal]
      description: "apenas: cuando aparecen, como mucho un mensaje al día; si responde, otro ese mismo día 2 horas después. diaria: una vez al día, a su hora. semanal: una vez a la semana, los lunes."
    hora:
      type: integer
      description: Hora local desde la que quiere recibirlos, de 8 a 18. Solo con diaria o semanal, y solo si la dijo (mañana 9, mediodía 12, tarde 16).
  required: [frecuencia]
access: public
request:
  method: POST
  path: /tools/frecuencia_avisos
  requires: [contact.phone_number]
  body:
    phone: "$contact.phone_number"
    frecuencia: null
    hora: null
respond:
  data:
    frecuencia: "$.frecuencia"
    activo: "$.activo"
  message: Frecuencia guardada. frecuencia dice cómo quedó; si activo es false, los avisos automáticos están en pausa.
