# guardar_preferencias
description: Guarda o actualiza el perfil de la persona (qué busca, estudios, si es su primer trabajo, tipo de trabajo, dónde) y devuelve los avisos que ya le sirven.
when_to_use: La persona cuenta por primera vez qué busca, o cambia o precisa algo de lo que busca. Manda solo los campos que cambiaron.
parameters:
  type: object
  properties:
    pais: { type: string, enum: [Chile, Colombia, México, Perú], description: "Solo si dice que busca en un país distinto al de su número." }
    nombre: { type: string, description: "Su nombre, solo si lo dijo." }
    resumen: { type: string, description: "Qué busca y a qué se dedica, en una o dos frases con sus palabras. Obligatorio la primera vez." }
    estudios: { type: string, description: "Qué estudia o estudió y en qué va, como 'Diseño gráfico, tercer año'. Solo si lo dijo." }
    primer_trabajo: { type: boolean, description: "true si busca su primera chamba; false si ya ha trabajado en lo suyo." }
    tipos:
      type: array
      description: "Tipo de trabajo que busca. Vacío si le da lo mismo."
      items: { type: string, enum: [practica, part_time, full_time] }
    cargos: { type: array, items: { type: string }, description: "Cargos a los que postularía, como 'analista contable'." }
    regiones:
      type: array
      description: "Región, provincia, estado o departamento donde busca, no la ciudad. Vacío si le da lo mismo."
      items: { type: string }
    modalidades:
      type: array
      description: "Solo si pidió alguna modalidad en particular."
      items: { type: string, enum: [presencial, hibrido, remoto] }
    sueldo_minimo: { type: integer, description: "Sueldo mensual mínimo en la moneda de su país, solo si lo dijo." }
    excluir: { type: array, items: { type: string }, description: "Lo que no quiere, como 'call center' o 'turnos de noche'." }
access: public
request:
  method: POST
  path: /tools/guardar_preferencias
  requires: [contact.phone_number]
  timeout: 30
  body:
    phone: "$contact.phone_number"
    pais:
    nombre:
    resumen:
    estudios:
    primer_trabajo:
    tipos:
    cargos:
    regiones:
    modalidades:
    sueldo_minimo:
    excluir:
